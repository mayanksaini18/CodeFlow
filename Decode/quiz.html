<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Decode</title>
    <link rel="stylesheet" href="styles.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

 
</head>
<body>
    <!-- Quiz Page -->
    <div id="quizPage" class="page active">
        <header class="header">
            <nav class="nav">
               <a class="btn btn-outline-secondary  ms-2" href="topics.html">
  <i class="bi bi-arrow-left"></i>
</a>

                <div class="quiz-info">
                    <span id="questionCounter">Question 1 of 5</span>
                </div>
            </nav>
        </header>

        <div class="container">
            <div class="quiz-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">0% Complete</p>
            </div>

            <div class="quiz-card">
                <h2 id="questionText">Loading question...</h2>
                <div class="options" id="optionsContainer">
                    <!-- Options will be populated by JavaScript -->
                </div>
                <div class="explanation" style="display: none; margin-top: 1.5rem; padding: 1rem; background-color: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;"></div>
            </div>
             <div class="flex justify-between mt-6">
                    <button type="button" class="bg-gray-200 hover:bg-gray-300 text-black px-4 py-2 rounded" onclick="goToPrevious()">← Previous</button>
                    <button type="button" class="bg-gray-200 hover:bg-gray-300 text-black px-4 py-2 rounded" onclick="goToNext()">Next →</button>
                </div>
                <p id="explanationText" class="mt-4 text-sm text-gray-700 hidden"></p>
        </div>

    </div>

    <script src="questions.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
