<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Results - DSA Quest</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .results-container {
      max-width: 600px;
      margin: auto;
      text-align: center;
      padding: 50px 20px;
    }
    .results-icon i {
      font-size: 5rem;
      color: #ffc107;
    }
    .score-card {
      margin: 30px 0;
    }
    .score-percentage {
      font-size: 3rem;
      font-weight: bold;
    }
    .stars .star {
      font-size: 2rem;
      color: gold;
    }
    .stars .star.empty {
      color: lightgray;
    }
    .btn-lg {
      margin: 10px;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <div class="results-container bg-white shadow rounded p-4">
      <div class="results-icon mb-3">
        <i class="bi bi-trophy-fill"></i>
      </div>
      <h1>Quiz Complete!</h1>
      <p class="text-muted">Great job on finishing the quiz</p>

      <div class="score-card">
        <div class="score-percentage" id="scorePercentage">0%</div>
        <p id="scoreText">Your Score: 0/0</p>
        <div class="stars" id="starsContainer">
          <!-- Stars will be populated by JavaScript -->
        </div>
      </div>

      <div class="results-buttons">
        <a href="topics.html" class="btn btn-primary btn-lg">
          <i class="bi bi-arrow-repeat me-1"></i>Try Another Topic
        </a>
        <a href="dashboard.html" class="btn btn-outline-secondary btn-lg">
          <i class="bi bi-bar-chart-line me-1"></i>View Dashboard
        </a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function renderResults() {
      const results = JSON.parse(localStorage.getItem('quizResults') || '{}');
      const percentage = results.percentage || 0;

      document.getElementById('scorePercentage').textContent = percentage + '%';
      document.getElementById('scoreText').textContent =
        `Your Score: ${results.score || 0}/${results.total || 0}`;

      const starsContainer = document.getElementById('starsContainer');
      starsContainer.innerHTML = '';
      const starCount = Math.floor(percentage / 20);

      for (let i = 0; i < 5; i++) {
        const star = document.createElement('span');
        star.className = 'star' + (i < starCount ? '' : ' empty');
        star.textContent = '★';
        starsContainer.appendChild(star);
      }
    }

    document.addEventListener('DOMContentLoaded', renderResults);
  </script>

</body>
</html>
